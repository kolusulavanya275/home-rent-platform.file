<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rent Payment</title>
    <link rel="stylesheet" href="styles.css">
    <style>/* Google Font */
      @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');
      
      * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
          font-family: 'Poppins', sans-serif;
      }
      
      body {
          background: #f8f9fa;
          display: flex;
          justify-content: center;
          align-items: center;
          height: 100vh;
      }
      
      .payment-container {
          background: #fff;
          padding: 20px;
          border-radius: 10px;
          box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
          width: 400px;
          text-align: center;
      }
      
      h2 {
          margin-bottom: 20px;
          color: #333;
      }
      
      label {
          display: block;
          text-align: left;
          font-weight: 600;
          margin: 10px 0 5px;
          color: #555;
      }
      
      input {
          width: 100%;
          padding: 10px;
          border: 1px solid #ccc;
          border-radius: 5px;
          font-size: 16px;
          margin-bottom: 10px;
      }
      
      .card-details {
          display: flex;
          justify-content: space-between;
      }
      
      .card-details div {
          width: 48%;
      }
      
      .pay-btn {
          width: 100%;
          background: #28a745;
          color: white;
          border: none;
          padding: 12px;
          font-size: 18px;
          border-radius: 5px;
          cursor: pointer;
          margin-top: 15px;
          transition: 0.3s;
      }
      
      .pay-btn:hover {
          background: #218838;
      }
      </style>
</head>
<body>
    <div class="payment-container">
        <h2>Home Rent Payment</h2>
        
        <form id="paymentForm">
            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Enter your full name" required>

            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter your email" required>

            <label for="phone number">Phone number</label>
            <input type="text" id="card" placeholder="1234 5678 9101 1121" required>

            <div class="card-details">
                <div>
                    <label for="expiry">Expiry Date</label>
                    <input type="text" id="expiry" placeholder="MM/YY" required>
                </div>
                <div>
                    <label for="cvv">CVV</label>
                    <input type="text" id="cvv" placeholder="123" required>
                </div>
            </div>

            <label for="amount">Amount</label>
            <input type="text" id="amount" placeholder="Enter rent amount" required>

            <button type="submit" class="pay-btn">Pay Now</button>
        </form>
    </div>

    <script>
      document.getElementById("paymentForm").addEventListener("submit", function(event) {
          event.preventDefault(); // Prevent form submission
          alert("Payment Successful! Redirecting to Home Page...");
          window.location.href = "home.html"; // ✅ Correct relative path
      });
  </script>
  
</body>
</html>
