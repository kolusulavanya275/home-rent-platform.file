<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Builder Services</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* General Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        body {
            background: linear-gradient(135deg, #007bff, #6610f2);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0px 10px 20px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 450px;
            text-align: center;
            animation: fadeIn 0.8s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h2 {
            color: #333;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            text-align: left;
            font-size: 14px;
            margin-top: 10px;
            color: #555;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease-in-out;
        }

        input:focus, textarea:focus {
            border-color: #007bff;
            outline: none;
            box-shadow: 0px 0px 8px rgba(0, 123, 255, 0.3);
        }

        button {
            margin-top: 20px;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #218838;
        }

        .loading {
            display: none;
            margin-top: 10px;
            font-size: 14px;
            color: #007bff;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Partner as a Builder</h2>
        <p>Join us to offer your construction services to property owners.</p>
        
        <form id="builderForm">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" placeholder="Enter your name" required>
            
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>
            
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>
            
            <label for="company">Company Name</label>
            <input type="text" id="company" name="company" placeholder="Your company name (if any)">
            
            <label for="services">Services Offered</label>
            <textarea id="services" name="services" placeholder="Describe your services..." rows="3"></textarea>
            
            <button type="submit">Submit Application</button>
            <p class="loading" id="loadingText">Processing... Redirecting</p>
        </form>
    </div>

    <script>
        document.getElementById("builderForm").addEventListener("submit", function(event) {
            event.preventDefault(); // Prevent default submission
            
            let loadingText = document.getElementById("loadingText");
            loadingText.style.display = "block"; // Show loading text
            
            setTimeout(() => {
                alert("Application Submitted Successfully! Redirecting to Home Page...");
                window.location.href = "home.html"; // Redirect after a small delay
            }, 2000); // Simulated delay of 2 seconds
        });
    </script>

</body>
</html>
