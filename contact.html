<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Rent Platform</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .property-card {
            border: 1px solid #ccc;
            padding: 16px;
            margin: 10px;
            width: 300px;
            display: inline-block;
            vertical-align: top;
        }
        .property-image {
            width: 100%;
            height: 200px;
            background-color: #f4f4f4;
        }
        .property-details {
            margin-top: 10px;
        }
        .view-contact-btn {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            margin-top: 10px;
        }
        .contact-number {
            margin-top: 10px;
            font-size: 16px;
            font-weight: bold;
            display: none; /* Hidden by default */
        }
    </style>
</head>
<body>
    <h1>Welcome to the Home Rent Platform</h1>

    <!-- Property 1 -->
    <div class="property-card">
        <div class="property-image"></div>
        <div class="property-details">
            <h3>Beautiful Apartment in Downtown</h3>
            <p>Price: $1200/month</p>
            <p>Location: Downtown City</p>
            <button class="view-contact-btn" onclick="viewContact(1)">View Contact</button>
            <p class="contact-number" id="contact-1">Contact: +1 234-567-890</p>
        </div>
    </div>

    <!-- Property 2 -->
    <div class="property-card">
        <div class="property-image"></div>
        <div class="property-details">
            <h3>Cozy Studio Near the Park</h3>
            <p>Price: $950/month</p>
            <p>Location: Central Park Area</p>
            <button class="view-contact-btn" onclick="viewContact(2)">View Contact</button>
            <p class="contact-number" id="contact-2">Contact: +1 987-654-321</p>
        </div>
    </div>

    <script>
        function viewContact(propertyId) {
            // Toggle the contact number visibility
            var contactElement = document.getElementById("contact-" + propertyId);
            if (contactElement.style.display === "none") {
                contactElement.style.display = "block"; // Show contact number
            } else {
                contactElement.style.display = "none";  // Hide contact number
            }
        }
    </script>
</body>
</html>
